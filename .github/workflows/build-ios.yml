name: Build iOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot 4.7
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip
          unzip Godot_v4.7-stable_macos.universal.zip -d godot
          sudo mv godot/Godot.app /Applications/Godot.app
          sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Download Godot 4.7 Export Templates
        run: |
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.7.stable
          wget https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          
          tar -xzf Godot_v4.7-stable_export_templates.tpz -C ~/Library/Application\ Support/Godot/export_templates/4.7.stable
          
          cd ~/Library/Application\ Support/Godot/export_templates/4.7.stable
          mv templates/* .
          rm -rf templates Godot_v4.7-stable_export_templates.tpz

      - name: Create build directory
        run: mkdir -p build

      - name: Export iOS project
        run: godot --headless --export-debug "iOS" "build/Pronoun Palace.xcodeproj"

      - name: Compile metal-cpp implementation
        run: |
          curl -sL "https://codeload.github.com/godotengine/godot/tar.gz/4.7-stable" | tar xz godot-4.7-stable/thirdparty/metal-cpp
          mv godot-4.7-stable/thirdparty/metal-cpp .
          clang++ -c metal-cpp/metal_cpp.cpp \
            -Imetal-cpp \
            -std=c++17 \
            -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=14.0 \
            -o build/metal_cpp_impl.o

      - name: Build iOS project
        run: |
          xcodebuild -project "build/Pronoun Palace.xcodeproj" \
                     -scheme "Pronoun Palace" \
                     -configuration Development \
                     -archivePath "build/Pronoun Palace.xcarchive" archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     OTHER_LDFLAGS="build/metal_cpp_impl.o -framework Foundation -framework QuartzCore -framework Metal -weak_framework MetalFX"

      - name: Export IPA
        run: |
          cd "build/Pronoun Palace.xcarchive/Products/Applications"
          mkdir Payload
          mv "Pronoun Palace.app" Payload/
          zip -r ../../../App.ipa Payload/

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ipa
          path: build/App.ipa
